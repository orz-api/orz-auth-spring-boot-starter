plugins {
    id 'signing'
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.orz-api'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withJavadocJar()
    withSourcesJar()
}

configurations {
    compileOnly.extendsFrom(annotationProcessor)
    configureEach {
        resolutionStrategy {
            cacheDynamicVersionsFor(0, 'seconds')
            cacheChangingModulesFor(0, 'seconds')
        }
    }
    mockitoAgent {
        transitive = false
    }
}

repositories {
    maven {
        name = 'Central Portal Snapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        content {
            includeVersionByRegex('.*', '.*', '.*SNAPSHOT')
        }
    }
    mavenCentral()
}

dependencies {
    api 'io.github.orz-api:orz-web-spring-boot-starter:0.1.0-SNAPSHOT'
    api 'com.auth0:java-jwt:4.5.0'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    mockitoAgent 'org.mockito:mockito-core'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", "-Xshare:off"
}

tasks.javadoc {
    options.encoding('UTF-8')
    options.addStringOption('Xdoclint:none', '-quiet')
    if (JavaVersion.current().java9Compatible) {
        options.addBooleanOption('html5', true)
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            pom {
                name = 'orz-auth-spring-boot-starter'
                description = 'orz-api auth spring boot starter'
                url = 'https://github.com/orz-api/orz-auth-spring-boot-starter'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit/'
                    }
                }
                developers {
                    developer {
                        id = 'reset7523'
                        name = 'reset7523'
                        email = 'reset7523@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com:orz-api/orz-auth-spring-boot-starter.git'
                    developerConnection = 'scm:git:git://github.com:orz-api/orz-auth-spring-boot-starter.git'
                    url = 'https://github.com/orz-api/orz-auth-spring-boot-starter'
                }
            }
        }
    }
    repositories {
        maven {
            url = version.endsWith('SNAPSHOT') ? 'https://central.sonatype.com/repository/maven-snapshots/' : 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials {
                username = orzSonatypeUsername
                password = orzSonatypePassword
            }
        }
    }
}

signing {
    sign(publishing.publications.mavenJava)
}
